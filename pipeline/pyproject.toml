[project]
name = "sargasso-pipeline"
version = "0.1.0"
description = "Fetches USF AFAI sargassum data from NOAA ERDDAP and writes the map's data files."
authors = [
    { name = "Puriya Mirza" }
]
requires-python = ">=3.13"
dependencies = [
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
]

[project.scripts]
sargasso-pipeline = "sargasso_pipeline:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
